name: lint

on:
  push:
    branches: [debug, main]
  pull_request:

jobs:
  shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check with the stock macOS bash (3.2)
        run: |
          for f in mac-hardening-install.sh mac-hardening-netlib.sh vpn_daily.sh tests/vm/*.sh tests/ci/*.sh; do
            /bin/bash -n "$f" && echo "ok  $f"
          done

      - name: shellcheck
        run: |
          brew install shellcheck
          shellcheck -S warning mac-hardening-install.sh mac-hardening-netlib.sh vpn_daily.sh tests/vm/*.sh tests/ci/*.sh

      - name: Offline tests (stubbed sudo, no system changes)
        run: /bin/bash tests/ci/offline.sh
